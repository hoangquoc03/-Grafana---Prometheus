global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: backend-app
    static_configs:
      - targets:
          - backend:8080

  - job_name: microservices
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.json
        refresh_interval: 30s
